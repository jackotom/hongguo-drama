<dialog id="info"><h2>红果·自用</h2><p>个人版 1.1 · Android 10及以上</p><p>无广告SDK，无推广位，无使用行为统计。发现、搜索和播放会连接红果内容服务；匿名播放身份只保留当前进程。收藏与观看记录仅保存在本机。</p><p>整集准备后开始播放，会产生移动数据流量。单集上限64MB；离开播放页即清理临时视频，不是离线下载库。</p><p>支持系统可解码的H.264／HEVC。ByteVC2暂不支持。来源拒绝或失效时会停止，不承诺所有分集可播。</p><p>基于GPL-3.0项目制作，保留原作者及第三方算法授权。手机实播兼容性待真机验收。</p><button id="close-info">知道了</button></dialog></body></html>
