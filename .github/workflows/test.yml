# 红果短剧 8.0：统一发行前的源码回归检查。
name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install real-media test tools
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      # Node fixtures mock Electron; real packaged launches run in the platform workflows.
      - run: npm test
        env:
          ELECTRON_OVERRIDE_DIST_PATH: ${{ runner.temp }}/unused-electron
      - run: node --test server/*.test.cjs
      - run: npm ci --prefix android --no-audit --no-fund
      - run: npm --prefix android test
