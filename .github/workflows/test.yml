# 红果短剧 5.2：统一发行前的源码回归检查。
name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install real-media test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm test
