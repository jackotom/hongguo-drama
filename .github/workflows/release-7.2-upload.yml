name: Transport five Windows 7.5.2 assets to existing draft
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: release-446852363-windows-transport
  cancel-in-progress: false
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRANSPORT_PLAN_SHA256: '2a6653e38e812e384d61b017ccaff83969270409e14f26c804d354f9c1cc7337'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen Windows artifact and upload only five accepted files
        run: >-
          python3 .github/release-7.5-windows-cloud.py
          --execute 4ffff289d6dd289e589a0fd0e65aa7aa5c2a7567
          --plan .github/release-7.5-windows-transport.json
          --plan-sha256 "$TRANSPORT_PLAN_SHA256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-7.5-windows-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport-result.json
          if-no-files-found: error
