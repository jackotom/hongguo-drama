                  });''')
                  source = replace(source, "episode.vid_index,'auto'", "episode.vid_index,'1080p'")
                  source = replace(source, '            const deadline=performance.now()+120000;', '            const deadline=Math.min(overallDeadline,performance.now()+180000);')
                  source = replace(source, "if(task&&['failed','stopped'].includes(task.status)){", "if(task&&(task.status==='stopped'||task.status==='failed'&&!(Number(task.retryAt)>0))){")
                  source = replace(source, '            const playDeadline=performance.now()+60000;', '            const playDeadline=Math.min(overallDeadline,performance.now()+60000);')
                  source = replace(source, "            if(!downloaded)throw Error('Real complete download timed out');", "            if(!downloaded)throw Error('Real complete download timed out');\n            if(downloaded.actualQuality!=='1080p')throw Error('Selected real download did not meet 1080p');")
                  source = replace(source, '            lastFailure=error.message;', '            lastFailure=error.message;throw error;')
                  source = replace(source, '    result.realPlayback = await cdp.evaluate', '    result.testInput = ' + selected + ';\n    result.realPlayback = await cdp.evaluate')
                  source = replace(source, 'No two playable real episodes in six dramas: ', 'Selected release pair did not complete: ')
                  source = replace(source, 'Fresh random Hongguo episodes 1 and 2: real source preparation and ten seconds muted playback each', 'Same release Mac random sample, episodes 1 and 2: fresh App downloads and ten seconds muted playback each')
                  Path('scripts/frozen-check-linux-appimage.cjs').write_text(source, encoding='utf-8')

          prepare_harness('windows')
          out=Path('dist')/('windows-verification')/'frozen-artifact-binding.json'
          receipt=json.loads(out.read_text())
          receipt['runtimeHarnessSha256']={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('scripts').glob('frozen-*.cjs')}
          out.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS only standalone acceptance harnesses were generated; frozen App packages unchanged')
          PY
        id: prepare
      - name: Run final portable App real queue and muted playback
        id: acceptance
        timeout-minutes: 12
        shell: pwsh
        run: |-
          $env:GITHUB_SHA = $env:FROZEN_SHA
          node scripts/frozen-check-windows-release.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run original fresh install, reinstall and real 1.80 upgrade
        id: installer
        timeout-minutes: 8
        shell: pwsh
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.verify-cache.outcome == 'success' }}
        run: |-
          $env:GITHUB_SHA = $env:FROZEN_SHA
          node scripts/check-windows-installer.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bind fresh result receipts to frozen source
        shell: bash
        run: |-
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path('dist')/('windows'+'-verification');out.mkdir(parents=True,exist_ok=True)
          names=['result.json','installer-result.json'] if 'windows'=='windows' else ['appimage-result.json']
          observed={}
          for name in names:
              p=out/name
              if p.is_file():
                  d=json.loads(p.read_text());observed[name]={'passed':d.get('passed'),'sourceCommit':d.get('sourceCommit'),'version':d.get('version')}
          passed=(os.environ['ACCEPTANCE_OUTCOME']=='success' and ('windows'!='windows' or os.environ['INSTALLER_OUTCOME']=='success')
                  and len(observed)==len(names) and all(d['passed'] is True and d['sourceCommit']==os.environ['FROZEN_SHA'] and d['version']=='7.5.0' for d in observed.values()))
          (out/'frozen-acceptance-status.json').write_text(json.dumps({'passed':passed,'sourceCommit':os.environ['FROZEN_SHA'],
           'workflowCommit':os.environ['WORKFLOW_COMMIT'],'platform':'windows','acceptanceOutcome':os.environ['ACCEPTANCE_OUTCOME'],
           'installerOutcome':os.environ.get('INSTALLER_OUTCOME'),'results':observed},indent=2)+'\n')
          assert passed, 'Final frozen acceptance did not pass; see independent evidence artifact'
          print('PASS fresh final-package acceptance receipts bind the exact frozen source')
          PY
        if: ${{ always() }}
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          INSTALLER_OUTCOME: ${{ steps.installer.outcome }}
      - name: Upload independent final-package acceptance evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: frozen-7.5-windows-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/windows-verification/*.json
          if-no-files-found: error
