# Hongguo Drama: build and verify the frozen desktop/Docker source.
name: Docker server candidate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full frozen source SHA (required for build_only; must match the dispatched ref)
        type: string
        default: ''
      build_only:
        description: Build and archive only; skip all functional, media, unit and platform acceptance checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify frozen source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          DISPATCH_SHA: ${{ github.sha }}
          BUILD_ONLY: ${{ inputs.build_only || false }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$BUILD_ONLY" == true && ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'build_only requires a full frozen source_sha' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$DISPATCH_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential pkg-config nasm curl git python3
      - uses: actions/cache@v4
        id: media
        with:
          path: ${{ runner.temp }}/linux-media
          key: linux-x64-media-${{ hashFiles('scripts/build-ffmpeg-source-linux.sh', 'scripts/build-librempeg-source.sh', 'scripts/librempeg-videotoolbox-prototype.patch', 'scripts/prepare-nv-codec-headers.sh') }}
      - name: Restore pinned 6.5 tools without executing the image or binaries
        if: ${{ inputs.build_only && steps.media.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reuse-release-media.py linux-x64 "$RUNNER_TEMP/linux-media"
      - if: ${{ !inputs.build_only && steps.media.outputs.cache-hit != 'true' }}
        run: |
          bash scripts/build-ffmpeg-source-linux.sh "$RUNNER_TEMP/linux-media/ffmpeg" 4
          bash scripts/build-librempeg-source.sh "$RUNNER_TEMP/linux-media/librempeg" linux-x64 4
      - run: |
          mkdir -p build/ffmpeg/linux-x64
          cp "$RUNNER_TEMP/linux-media/ffmpeg/artifacts/bin/"* build/ffmpeg/linux-x64/
          cp "$RUNNER_TEMP/linux-media/librempeg/artifacts/bin/"* build/ffmpeg/linux-x64/
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - if: ${{ !inputs.build_only }}
        run: node scripts/check-linux-media.cjs
      - if: ${{ !inputs.build_only }}
        run: node --test server/*.test.cjs
      - name: Build the exact server image
        run: |
          version=$(node -p "require('./package.json').version")
          public_version=$(node -p "require('./package.json').version.replace(/\.0$/, '')")
          docker build --platform linux/amd64 --label org.opencontainers.image.version="$version" --label org.opencontainers.image.revision="$GITHUB_SHA" -t "hongguo-drama:$public_version" .
      - name: Run Docker functional acceptance
        if: ${{ !inputs.build_only }}
        run: node scripts/check-docker-release.cjs
      - name: Save the image and corresponding media sources
        run: |
          mkdir -p dist/docker
          version=$(node -p "require('./package.json').version.replace(/\.0$/, '')")
          docker save "hongguo-drama:$version" | gzip > "dist/docker/hongguo-drama-$version-docker-amd64.tar.gz"
          cp "$RUNNER_TEMP/linux-media/ffmpeg/artifacts/"*source.tar.gz "$RUNNER_TEMP/linux-media/librempeg/artifacts/"*source.tar.gz dist/docker/
          sed "s|^    image: hongguo-drama:.*|    image: hongguo-drama:$version|" compose.yaml > dist/docker/compose.yaml
          grep -Fqx "    image: hongguo-drama:$version" dist/docker/compose.yaml
          cp docs/docker.md dist/docker/
          git archive --format=zip --output="dist/docker/hongguo-drama-$version-docker-source.zip" HEAD
          printf '%s\n' "$GITHUB_SHA" > dist/docker/SOURCE-SHA.txt
          (cd dist/docker && sha256sum * > DOCKER-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-server-candidate
          path: dist/docker/
