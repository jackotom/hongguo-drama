name: Transport exact 7.1.2 assets to existing draft
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: release-442529335-7.1-transport
  cancel-in-progress: false
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRANSPORT_PLAN_SHA256: '767349c4e677f9a6460c1059ab7f8bb09d14e01fb5b5063d7d05e6a15e06d33a'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify originals, reassemble current chunks and fill only the specified draft
        run: >-
          python3 .github/release-7.1-cloud.py
          --execute bdab9d6158e07524f234f88c1168f20baa2cd507
          --plan .github/release-7.1-transport.json
          --plan-sha256 "$TRANSPORT_PLAN_SHA256"
          --assembly-plan .github/release-7.1-upload-plan.json
          --binding .github/release-7.1-artifact-binding.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-7.1-transport-verification
          path: transport-result.json
          if-no-files-found: error
