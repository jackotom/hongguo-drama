name: Upload verified 6.7 artifacts
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-candidate
          run-id: 42837198838
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: transport/windows
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage-candidate
          run-id: 42837196497
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: transport/linux
      - uses: actions/download-artifact@v4
        with:
          name: docker-server-candidate
          run-id: 42837196496
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: transport/docker
      - name: Reassemble exact signed files and finish the existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/release-6.7-transport.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-6.7-transport-verification
          path: transport-result.json
